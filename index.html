<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目导航</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0 0 0 200px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 200px;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            padding: 1rem;
        }
        .sidebar h2 {
            color: #2c3e50;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #eee;
        }
        .category {
            margin-bottom: 1rem;
        }
        .category a {
            display: block;
            padding: 0.5rem;
            color: #3498db;
            text-decoration: none;
            border-radius: 4px;
        }
        .category a:hover {
            background: #f0f7ff;
        }
        .submenu {
            display: none;
            position: absolute;
            left: 200px;
            top: 0;
            width: 200px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            padding: 1rem;
            z-index: 100;
        }
        .category:hover .submenu {
            display: block;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeIn 1s ease-in;
        }
        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .nav-card {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }
        .nav-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        .nav-card a {
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
            font-size: 1.1rem;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>分类导航</h2>
        <div class="category">
            <a href="#ai">AI类</a>
            <div class="submenu">
                <a href="scratch/scratch聊天1.0.html">Scratch聊天1.0</a>
            </div>
        </div>
        <div class="category">
            <a href="#games">游戏类</a>
        </div>
    </div>
    <div class="container">
        <header>
            <h1>辉辉的作品</h1>
            <p>选择您要访问的项目</p>
        </header>
        <div class="nav-grid">
            <div class="nav-card" data-category="ai">
                <a href="scratch/scratch聊天1.0.html">Scratch聊天1.0</a>
                <p>一个简单的聊天界面</p>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const aiCategory = document.querySelector('.category a[href="#ai"]');
            const aiSubmenu = document.querySelector('.category .submenu');
            
            aiCategory.addEventListener('click', function(e) {
                e.preventDefault();
                aiSubmenu.style.display = aiSubmenu.style.display === 'block' ? 'none' : 'block';
            });
        });
    </script>
</body>
</html>
