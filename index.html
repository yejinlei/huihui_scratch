<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辉辉的代码世界</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', 'Comic Sans MS', cursive, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0 0 0 200px;
            background: 
                linear-gradient(135deg, rgba(255,204,230,0.9) 0%, rgba(153,204,255,0.9) 100%),
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='rgba(0,0,0,0.02)'/><text x='0' y='10' font-family='monospace' font-size='10' fill='rgba(0,0,0,0.05)'>01010101 01101000 01101111 01101101 01100101</text><rect x='0' y='0' width='100%' height='100%' fill='none' stroke='rgba(0,255,255,0.03)' stroke-width='1' stroke-dasharray='5,5'/></svg>");
            min-height: 100vh;
            animation: binaryScroll 20s linear infinite, pixelGlow 2s ease-in-out infinite alternate, pixelFlicker 0.5s steps(1) infinite alternate;
            position: relative;
            overflow: hidden;
        }
        
        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><rect width='20' height='20' fill='none' stroke='rgba(0,255,255,0.1)' stroke-width='1'/></svg>") repeat;
            pointer-events: none;
            z-index: -1;
            opacity: 0.5;
        }
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 200px;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            padding: 1rem;
            border-right: 4px solid #ff9966;
        }
        .sidebar h2 {
            color: #2c3e50;
            font-family: 'Press Start 2P', 'Comic Sans MS', cursive, sans-serif;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #eee;
        }
        .category {
            margin-bottom: 1rem;
        }
        .category a {
            display: block;
            padding: 0.5rem;
            color: #3498db;
            font-family: 'Press Start 2P', 'Comic Sans MS', cursive, sans-serif;
            text-decoration: none;
            border-radius: 4px;
        }
        .category a:hover {
            background: #f0f7ff;
        }
        .submenu {
            display: none;
            position: absolute;
            left: 200px;
            top: 40px;
            width: 200px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            padding: 1rem;
            z-index: 100;
        }
        .category:hover .submenu {
            display: block;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeIn 1s ease-in;
        }
        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .nav-card {
            background: rgba(255,255,255,0.8);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), 0 4px 12px rgba(255, 153, 102, 0.3), 0 0 30px rgba(255, 0, 255, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
            border: 2px solid #ff3366;
            position: relative;
            overflow: hidden;
            animation: pixelGlow 3s ease-in-out infinite alternate, pixelFlicker 0.3s steps(1) infinite alternate;
        }
        .nav-card::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 2px dashed rgba(0,255,255,0.3);
            border-radius: 12px;
            animation: borderPulse 2s linear infinite;
            pointer-events: none;
        }
        .nav-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        .nav-card a {
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
            font-size: 1.1rem;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes borderPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes binaryScroll {
            from { background-position: 0 0; }
            to { background-position: 100px 100px; }
        }
        
        @keyframes pixelGlow {
            0% { box-shadow: 0 0 5px 0 rgba(0, 255, 255, 0.5); }
            100% { box-shadow: 0 0 20px 10px rgba(255, 0, 255, 0.7); }
        }
        
        @keyframes pixelFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; }
        }
        
        @keyframes neonPulse {
            0%, 100% { text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff; }
            50% { text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff, 0 0 15px #00ffff; }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 0;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                padding: 1rem 0;
            }
            .submenu {
                position: relative;
                left: 0;
                top: 0;
                width: 100%;
                box-shadow: none;
            }
            .container {
                padding: 1rem;
            }
            h1 {
                font-size: 1.8rem;
            }
            .nav-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 480px) {
            .nav-card {
                padding: 1rem;
            }
            .nav-card a {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>分类导航</h2>
        <div class="category">
            <a href="#ai">AI类</a>
            <div class="submenu">
                <a href="scratch/scratch聊天1.0.html" target="_blank">Scratch聊天1.0</a>
            </div>
        </div>
        <div class="category">
            <a href="#games">游戏类</a>
        </div>
    </div>
    <div class="container">
        <header>
            <h1 style="color: #ff3366; text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff; animation: neonPulse 1.5s ease-in-out infinite alternate;">辉辉的<span style="color: #00ffff">代码</span>世界</h1>
            <p>选择您要访问的项目</p>
        </header>
        <div class="nav-grid">
            <div class="nav-card" data-category="ai">
                <a href="scratch/scratch聊天1.0.html" target="_blank">Scratch聊天1.0</a>
                <p>一个简单的聊天界面</p>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const aiCategory = document.querySelector('.category a[href="#ai"]');
            const aiSubmenu = document.querySelector('.category .submenu');
            
            aiCategory.addEventListener('click', function(e) {
                e.preventDefault();
                aiSubmenu.style.display = aiSubmenu.style.display === 'block' ? 'none' : 'block';
            });
        });
    </script>
</body>
</html>
